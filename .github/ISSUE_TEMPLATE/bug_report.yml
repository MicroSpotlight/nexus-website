name: Bug report
description: Report a reproducible Nexus problem without sharing private source data.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please remove credentials, private URLs, tokens, cookies, personal data, and copyrighted media.
  - type: input
    id: version
    attributes:
      label: Nexus version
      placeholder: 0.1.0 (build 38)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Device and iOS/iPadOS version
      placeholder: iPhone 17 Pro, iOS 26.5
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: 1. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Source type and redacted context
      description: Say local file, WebDAV, SMB/NAS, media server, or catalog endpoint. Never paste a private URL or credential.
